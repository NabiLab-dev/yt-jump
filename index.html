<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="구간이동">
<meta name="theme-color" content="#191233">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>유튜브 · 내 영상 구간이동</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    color: #f0f1f8; background: #14101f; overflow: hidden;
    user-select: none; -webkit-user-select: none;
  }

  /* 배경 */
  .bg { position: fixed; inset: 0; z-index: -1; overflow: hidden;
    background: linear-gradient(160deg, #191233 0%, #140f26 55%, #0f0c1e 100%); }
  .bg span { position: absolute; border-radius: 50%; filter: blur(70px); opacity: 0.5; animation: float 14s ease-in-out infinite; }
  .bg span:nth-child(1) { width: 280px; height: 280px; background: #7c4dff; top: -60px; left: -60px; }
  .bg span:nth-child(2) { width: 260px; height: 260px; background: #2196f3; bottom: -80px; right: -60px; animation-delay: -5s; }
  .bg span:nth-child(3) { width: 200px; height: 200px; background: #ff4d94; top: 40%; right: -80px; animation-delay: -9s; opacity: 0.3; }
  @keyframes float { 0%,100%{transform:translate(0,0) scale(1);} 50%{transform:translate(18px,-22px) scale(1.08);} }
  @media (prefers-reduced-motion: reduce) { .bg span { animation: none; } }

  /* 레이아웃 */
  .app { height: 100vh; height: 100dvh; display: flex; flex-direction: column; gap: 10px;
    padding: 10px 12px calc(10px + env(safe-area-inset-bottom)); }
  .stage { position: relative; flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; overflow: hidden; }
  .videowrap { position: relative; aspect-ratio: 16 / 9; background: #000; border-radius: 16px; overflow: hidden;
    border: 1px solid rgba(255,255,255,0.08); box-shadow: 0 12px 34px rgba(0,0,0,0.55);
    display: flex; align-items: center; justify-content: center; }
  @media (orientation: portrait)  { .videowrap { width: 100%; max-height: 100%; } }
  @media (orientation: landscape) { .videowrap { height: 100%; max-width: 100%; } }
  #player { width: 100%; height: 100%; }
  #localVideo { width: 100%; height: 100%; object-fit: contain; background: #000; display: none; }

  .placeholder { width: 100%; color: #6b7095; font-size: 13.5px; text-align: center; padding: 20px; line-height: 1.7; }
  .placeholder .big { font-size: 30px; display: block; margin-bottom: 6px; }
  .status-msg { position: absolute; inset: 0; display: none; align-items: center; justify-content: center; text-align: center;
    background: rgba(10,8,20,0.85); backdrop-filter: blur(4px); color: #ffb74d; font-size: 13.5px; padding: 20px; line-height: 1.6; }
  .status-msg.show { display: flex; }
  .seek-toast { position: absolute; top: 50%; left: 50%; z-index: 5; transform: translate(-50%,-50%) scale(0.75); opacity: 0;
    background: rgba(15,12,28,0.72); backdrop-filter: blur(6px); padding: 10px 20px; border-radius: 999px;
    font-size: 18px; font-weight: 800; letter-spacing: 0.5px; pointer-events: none; border: 1px solid rgba(255,255,255,0.12);
    transition: opacity 0.22s ease, transform 0.22s ease; }
  .seek-toast.show { opacity: 1; transform: translate(-50%,-50%) scale(1); }
  .seek-toast.back { color: #ff8a80; } .seek-toast.fwd { color: #80d8ff; } .seek-toast.rate { color: #d9b8ff; }

  /* 패널 */
  .panel { flex-shrink: 0; display: flex; flex-direction: column; gap: 10px;
    background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.09); border-radius: 20px; padding: 12px;
    backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); }

  /* 탭 */
  .tabs { display: flex; gap: 4px; background: rgba(0,0,0,0.25); border-radius: 12px; padding: 4px; }
  .tab { flex: 1; height: 36px; border: none; border-radius: 9px; background: transparent; color: #9498c0;
    font-size: 13.5px; font-weight: 700; cursor: pointer; transition: all 0.15s; }
  .tab.active { background: linear-gradient(135deg,#4fc3f7,#7c4dff); color: #0e1224; }

  .url-row { display: flex; gap: 8px; }
  .input-wrap { flex: 1; position: relative; display: flex; align-items: center; }
  .input-wrap svg { position: absolute; left: 12px; width: 15px; height: 15px; color: #7a83a8; pointer-events: none; }
  #urlInput { width: 100%; height: 44px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.08);
    background: rgba(0,0,0,0.28); color: #eee; padding: 0 12px 0 34px; font-size: 14px; outline: none; transition: border-color 0.15s, background 0.15s; }
  #urlInput::placeholder { color: #6b7095; }
  #urlInput:focus { border-color: #7c9dff; background: rgba(0,0,0,0.4); }
  #loadBtn { height: 44px; padding: 0 18px; border-radius: 12px; border: none;
    background: linear-gradient(135deg, #4fc3f7, #7c4dff); color: #0e1224; font-weight: 800; font-size: 14px; cursor: pointer; white-space: nowrap;
    box-shadow: 0 6px 18px rgba(124,77,255,0.35); transition: transform 0.12s; }
  #loadBtn:active { transform: scale(0.95); }

  .pick-btn { width: 100%; height: 48px; border-radius: 12px; border: 1px dashed rgba(255,255,255,0.22);
    background: rgba(255,255,255,0.04); color: #c7cae8; font-size: 14px; font-weight: 700; cursor: pointer; transition: background 0.12s; }
  .pick-btn:active { background: rgba(255,255,255,0.09); }
  .saved-head { display: flex; align-items: center; justify-content: space-between; margin: 10px 2px 6px; }
  .storage { font-size: 10px; color: #6b7095; }
  .saved-list { display: flex; flex-direction: column; gap: 6px; max-height: 210px; overflow-y: auto; -webkit-overflow-scrolling: touch; }
  .saved-item { display: flex; align-items: center; gap: 9px; padding: 6px; border-radius: 12px;
    background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.07); cursor: pointer; transition: background 0.12s, border-color 0.12s; }
  .saved-item:active { background: rgba(255,255,255,0.1); }
  .saved-item.playing { border-color: #7c9dff; background: rgba(124,157,255,0.14); }
  .saved-thumb { width: 56px; height: 34px; border-radius: 7px; object-fit: cover; background: #000; flex-shrink: 0; }
  .saved-info { flex: 1; min-width: 0; }
  .saved-name { font-size: 12.5px; color: #e7e9f5; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .saved-dur { font-size: 11px; color: #8f93b8; font-variant-numeric: tabular-nums; margin-top: 1px; }
  .saved-del { width: 30px; height: 30px; flex-shrink: 0; border: none; border-radius: 8px;
    background: rgba(239,83,80,0.14); color: #ff8a80; font-size: 17px; line-height: 1; cursor: pointer; }
  .saved-del:active { background: rgba(239,83,80,0.3); }
  .saved-empty { font-size: 11.5px; color: #6b7095; text-align: center; padding: 12px; }

  .progress-track { width: 100%; height: 5px; border-radius: 999px; background: rgba(255,255,255,0.08); overflow: hidden; }
  .progress-fill { height: 100%; width: 0%; border-radius: 999px; background: linear-gradient(90deg,#4fc3f7,#7c4dff); transition: width 0.25s linear; }
  .time-row { display: flex; justify-content: center; gap: 8px; font-size: 12.5px; color: #9498c0; font-variant-numeric: tabular-nums; }

  .label { font-size: 11px; font-weight: 700; color: #7f83a8; letter-spacing: 0.5px; margin: 0 2px; }

  .seek-grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 7px; }
  .seek-btn { height: 60px; border-radius: 14px; border: 1px solid rgba(255,255,255,0.07); background: rgba(255,255,255,0.045);
    color: #eee; cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; transition: transform 0.1s, background 0.12s; }
  .seek-btn:active { transform: scale(0.92); background: rgba(255,255,255,0.1); }
  .icon-badge { width: 26px; height: 26px; border-radius: 50%; display: flex; align-items: center; justify-content: center; }
  .seek-btn.back .icon-badge { background: rgba(239,83,80,0.16); } .seek-btn.back svg { color: #ff8a80; }
  .seek-btn.fwd  .icon-badge { background: rgba(79,195,247,0.16); } .seek-btn.fwd svg { color: #4fc3f7; }
  .seek-btn .sec { font-size: 11px; color: #9498c0; font-weight: 700; }

  /* 속도 스테퍼 */
  .stepper { display: flex; align-items: center; gap: 8px; }
  .step-btn { width: 56px; height: 48px; flex-shrink: 0; border-radius: 14px; border: 1px solid rgba(255,255,255,0.08);
    background: rgba(255,255,255,0.05); color: #fff; font-size: 26px; font-weight: 600; cursor: pointer; line-height: 1; transition: transform 0.1s, background 0.12s; }
  .step-btn:active { transform: scale(0.92); background: rgba(255,255,255,0.12); }
  .step-btn:disabled { opacity: 0.35; }
  .step-val { flex: 1; height: 48px; border-radius: 14px; display: flex; align-items: center; justify-content: center;
    background: linear-gradient(135deg,#4fc3f7,#7c4dff); color: #0e1224; font-size: 20px; font-weight: 800;
    cursor: pointer; letter-spacing: 0.3px; font-variant-numeric: tabular-nums; }
  .step-val small { font-size: 11px; font-weight: 700; opacity: 0.7; margin-left: 5px; }

  .toggle { display: flex; align-items: center; gap: 8px; cursor: pointer; background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.07); border-radius: 12px; padding: 8px 12px; }
  .switch { width: 40px; height: 23px; border-radius: 999px; background: rgba(255,255,255,0.15); position: relative; transition: background 0.18s; flex-shrink: 0; }
  .switch::after { content:''; position:absolute; top:2px; left:2px; width:19px; height:19px; border-radius:50%; background:#fff; transition: transform 0.18s; }
  .toggle.on .switch { background: linear-gradient(135deg,#4fc3f7,#7c4dff); }
  .toggle.on .switch::after { transform: translateX(17px); }
  .toggle .txt { font-size: 12.5px; font-weight: 600; color: #c7cae8; }
  .hint { font-size: 11px; color: #6b7095; line-height: 1.5; }

  @media (orientation: landscape) {
    .app { flex-direction: row; gap: 12px; }
    .stage { flex: 1; }
    .panel { width: 300px; flex-shrink: 0; overflow-y: auto; }
  }
</style>
</head>
<body>
<div class="bg"><span></span><span></span><span></span></div>

<div class="app">
  <div class="stage">
    <!-- 유튜브 -->
    <div class="videowrap" id="ytBox">
      <div class="placeholder" id="ytPlaceholder"><span class="big">▶</span>링크를 붙여넣고 불러오기를 눌러주세요<br><span style="font-size:11px;opacity:0.7">폰을 가로로 돌리면 화면이 커져요</span></div>
      <div id="player"></div>
      <div class="status-msg" id="statusMsg"></div>
    </div>
    <!-- 내 파일 -->
    <div class="videowrap" id="localBox" style="display:none">
      <div class="placeholder" id="localPlaceholder"><span class="big">📁</span>갤러리에서 영상을 선택하세요<br><span style="font-size:11px;opacity:0.7">파일은 폰 밖으로 나가지 않아요</span></div>
      <video id="localVideo" playsinline controls></video>
    </div>
    <div class="seek-toast" id="seekToast"></div>
  </div>

  <div class="panel">
    <div class="tabs">
      <button class="tab active" data-mode="yt">유튜브</button>
      <button class="tab" data-mode="local">내 파일</button>
    </div>

    <!-- 유튜브 컨트롤 -->
    <div class="url-row" id="ytControls">
      <div class="input-wrap">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M10 13a5 5 0 0 0 7.07 0l2.83-2.83a5 5 0 0 0-7.07-7.07l-1.5 1.5"/><path d="M14 11a5 5 0 0 0-7.07 0L4.1 13.83a5 5 0 0 0 7.07 7.07l1.49-1.49"/></svg>
        <input id="urlInput" type="text" placeholder="유튜브 링크 또는 영상 ID" inputmode="url">
      </div>
      <button id="loadBtn">불러오기</button>
    </div>

    <!-- 내 파일 컨트롤 -->
    <div id="fileControls" style="display:none">
      <input type="file" id="fileInput" accept="video/*" style="display:none">
      <button class="pick-btn" id="pickBtn">＋ 갤러리에서 영상 추가</button>
      <div class="saved-head" id="savedHead" style="display:none">
        <span class="label" style="margin:0">저장된 영상</span>
        <span class="storage" id="storageInfo"></span>
      </div>
      <div class="saved-list" id="savedList"></div>
    </div>

    <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
    <div class="time-row" id="timeRow">--:-- / --:--</div>

    <div class="label">구간 이동</div>
    <div class="seek-grid">
      <button class="seek-btn back" data-sec="-10"><span class="icon-badge"><svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor"><path d="M11 18V6l-8.5 6 8.5 6zm.5-6 8.5 6V6l-8.5 6z"/></svg></span><span class="sec">10초</span></button>
      <button class="seek-btn back" data-sec="-5"><span class="icon-badge"><svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor"><path d="M11 18V6l-8.5 6 8.5 6zm.5-6 8.5 6V6l-8.5 6z"/></svg></span><span class="sec">5초</span></button>
      <button class="seek-btn back" data-sec="-3"><span class="icon-badge"><svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor"><path d="M15.41 7.41 14 6l-6 6 6 6 1.41-1.41L10.83 12z"/></svg></span><span class="sec">3초</span></button>
      <button class="seek-btn fwd" data-sec="3"><span class="icon-badge"><svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor"><path d="M8.59 16.59 10 18l6-6-6-6-1.41 1.41L13.17 12z"/></svg></span><span class="sec">3초</span></button>
      <button class="seek-btn fwd" data-sec="5"><span class="icon-badge"><svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor"><path d="M13 6v12l8.5-6L13 6zm-.5 6L4 6v12l8.5-6z"/></svg></span><span class="sec">5초</span></button>
      <button class="seek-btn fwd" data-sec="10"><span class="icon-badge"><svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor"><path d="M13 6v12l8.5-6L13 6zm-.5 6L4 6v12l8.5-6z"/></svg></span><span class="sec">10초</span></button>
    </div>

    <div class="label" id="speedLabel">재생 속도 · 0.25씩</div>
    <div class="stepper">
      <button class="step-btn" id="speedDown">−</button>
      <div class="step-val" id="speedVal">1×</div>
      <button class="step-btn" id="speedUp">+</button>
    </div>

    <div class="toggle on" id="wakeToggle"><div class="switch"></div><span class="txt">화면 꺼짐 방지</span></div>
    <div class="hint" id="hint">임베드가 허용된 영상만 재생돼요. 일부 영상은 저작권/설정 때문에 안 열릴 수 있어요.</div>
  </div>
</div>

<script>
  let mode = 'yt';                 // 'yt' | 'local'
  let player = null, ytReady = false;
  let ytRate = 1, localRate = 1;   // 모드별 배속 기억
  let currentRate = 1;
  let keepAwake = true, wakeLock = null;

  const $ = id => document.getElementById(id);
  const urlInput = $('urlInput'), loadBtn = $('loadBtn');
  const ytBox = $('ytBox'), localBox = $('localBox');
  const ytPlaceholder = $('ytPlaceholder'), localPlaceholder = $('localPlaceholder');
  const statusMsg = $('statusMsg'), timeRow = $('timeRow'), progressFill = $('progressFill');
  const seekToast = $('seekToast');
  const ytControls = $('ytControls'), fileControls = $('fileControls');
  const fileInput = $('fileInput'), pickBtn = $('pickBtn');
  const savedList = $('savedList'), savedHead = $('savedHead'), storageInfo = $('storageInfo');
  const localVideo = $('localVideo');
  const speedVal = $('speedVal'), speedLabel = $('speedLabel'), speedDown = $('speedDown'), speedUp = $('speedUp');
  const wakeToggle = $('wakeToggle'), hint = $('hint');

  // ── 공통 헬퍼 (활성 소스로 위임) ──
  function curTime() { return mode==='yt' ? (player && player.getCurrentTime ? player.getCurrentTime() : 0) : (localVideo.currentTime || 0); }
  function duration() { return mode==='yt' ? (player && player.getDuration ? player.getDuration() : 0) : (localVideo.duration || 0); }
  function seekTo(t) { if (mode==='yt') { if (player && player.seekTo) player.seekTo(t, true); } else { localVideo.currentTime = t; } }
  function setRate(r) { if (mode==='yt') { if (player && player.setPlaybackRate) player.setPlaybackRate(r); } else { localVideo.playbackRate = r; } }

  function fmt(t) { if (!isFinite(t) || t < 0) t = 0; const m = Math.floor(t/60), s = Math.floor(t%60); return m + ':' + String(s).padStart(2,'0'); }
  function showStatus(t) { statusMsg.textContent = t; statusMsg.classList.add('show'); }
  function hideStatus() { statusMsg.classList.remove('show'); }

  let toastTimer = null;
  function showToast(text, cls) { seekToast.className = 'seek-toast show ' + cls; seekToast.textContent = text; clearTimeout(toastTimer); toastTimer = setTimeout(() => seekToast.classList.remove('show'), 550); }

  // ── 화면 꺼짐 방지 ──
  async function requestWakeLock() { if (!keepAwake) return; try { if ('wakeLock' in navigator) wakeLock = await navigator.wakeLock.request('screen'); } catch(e){} }
  async function releaseWakeLock() { try { if (wakeLock) { await wakeLock.release(); wakeLock = null; } } catch(e){} }
  document.addEventListener('visibilitychange', () => { if (document.visibilityState==='visible' && keepAwake) requestWakeLock(); });
  wakeToggle.addEventListener('click', () => { keepAwake = !keepAwake; wakeToggle.classList.toggle('on', keepAwake); if (keepAwake) requestWakeLock(); else releaseWakeLock(); });

  // ── 속도 스테퍼 ──
  // 모드별 [최소, 최대, 단위]
  function speedCfg() { return mode==='yt' ? { min:0.5, max:1, step:0.25 } : { min:0.25, max:2, step:0.05 }; }
  function rateText(r) { return (Math.round(r*100)/100) + '×'; }
  function renderSpeed() {
    const { min, max } = speedCfg();
    speedVal.textContent = rateText(currentRate);
    speedDown.disabled = currentRate <= min + 1e-9;
    speedUp.disabled = currentRate >= max - 1e-9;
  }
  function configSpeedForMode() {
    const cfg = speedCfg();
    currentRate = mode==='yt' ? ytRate : localRate;
    speedLabel.textContent = '재생 속도 · ' + cfg.step + '씩';
    renderSpeed();
  }
  function nudgeSpeed(dir) {
    const { min, max, step } = speedCfg();
    let r = Math.round((currentRate + dir*step) * 100) / 100;
    r = Math.max(min, Math.min(max, r));
    currentRate = r;
    if (mode==='yt') ytRate = r; else localRate = r;
    setRate(r); renderSpeed(); showToast(rateText(r) + ' 속도', 'rate');
  }
  speedDown.addEventListener('click', () => nudgeSpeed(-1));
  speedUp.addEventListener('click', () => nudgeSpeed(1));
  speedVal.addEventListener('click', () => { currentRate = 1; if (mode==='yt') ytRate=1; else localRate=1; setRate(1); renderSpeed(); showToast('1× 속도', 'rate'); });

  // ── 탭 전환 ──
  document.querySelectorAll('.tab').forEach(tab => {
    tab.addEventListener('click', () => {
      const m = tab.dataset.mode; if (m===mode) return;
      if (mode==='yt') { if (player && player.pauseVideo) player.pauseVideo(); } else { localVideo.pause(); }
      mode = m;
      document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t===tab));
      ytBox.style.display = m==='yt' ? 'flex' : 'none';
      localBox.style.display = m==='local' ? 'flex' : 'none';
      ytControls.style.display = m==='yt' ? 'flex' : 'none';
      fileControls.style.display = m==='local' ? 'block' : 'none';
      hint.textContent = m==='yt'
        ? '임베드가 허용된 영상만 재생돼요. 일부 영상은 저작권/설정 때문에 안 열릴 수 있어요.'
        : '추가한 영상은 앱에 저장돼 다음에도 목록에서 바로 열 수 있어요. 폰 밖으로 업로드되지 않아요.';
      configSpeedForMode();
    });
  });

  // ── YouTube ──
  const tag = document.createElement('script'); tag.src = 'https://www.youtube.com/iframe_api'; document.head.appendChild(tag);
  window.onYouTubeIframeAPIReady = () => { ytReady = true; };
  function loadVideo(id) {
    hideStatus(); ytPlaceholder.style.display = 'none'; requestWakeLock();
    if (!ytReady) { const w = setInterval(() => { if (ytReady) { clearInterval(w); loadVideo(id); } }, 150); return; }
    if (player) { player.loadVideoById(id); player.setPlaybackRate(ytRate); return; }
    player = new YT.Player('player', {
      videoId: id, playerVars: { playsinline: 1, rel: 0 },
      events: {
        onReady: () => player.setPlaybackRate(ytRate),
        onStateChange: (e) => { if (e.data === YT.PlayerState.PLAYING) { player.setPlaybackRate(ytRate); requestWakeLock(); } },
        onError: (e) => { const c = {2:'잘못된 영상 ID예요.',5:'재생할 수 없는 영상이에요.',100:'영상을 찾을 수 없어요.',101:'이 영상은 외부 재생이 차단되어 있어요.',150:'이 영상은 외부 재생이 차단되어 있어요.'}; showStatus(c[e.data] || '영상을 불러올 수 없어요.'); }
      }
    });
  }
  function extractId(input) {
    input = input.trim();
    if (/^[a-zA-Z0-9_-]{11}$/.test(input)) return input;
    const ps = [/youtu\.be\/([a-zA-Z0-9_-]{11})/, /youtube\.com\/shorts\/([a-zA-Z0-9_-]{11})/, /youtube\.com\/embed\/([a-zA-Z0-9_-]{11})/, /[?&]v=([a-zA-Z0-9_-]{11})/];
    for (const p of ps) { const m = input.match(p); if (m) return m[1]; } return null;
  }
  loadBtn.addEventListener('click', () => { const id = extractId(urlInput.value); if (!id) { ytPlaceholder.style.display='none'; showStatus('유효한 유튜브 링크나 영상 ID가 아니에요.'); return; } loadVideo(id); });
  urlInput.addEventListener('keydown', (e) => { if (e.key==='Enter') loadBtn.click(); });

  // ── 내 파일 (저장 목록 · IndexedDB) ──
  let db = null, currentSavedId = null, localObjURL = null;

  function openDB() {
    return new Promise((res, rej) => {
      const req = indexedDB.open('ytjump', 1);
      req.onupgradeneeded = () => {
        const d = req.result;
        if (!d.objectStoreNames.contains('meta')) d.createObjectStore('meta', { keyPath: 'id' });
        if (!d.objectStoreNames.contains('blobs')) d.createObjectStore('blobs', { keyPath: 'id' });
      };
      req.onsuccess = () => res(req.result);
      req.onerror = () => rej(req.error);
    });
  }
  const store = (name, mode) => db.transaction(name, mode).objectStore(name);
  const idb = r => new Promise((res, rej) => { r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); });
  async function addVideo(meta, blob) { await idb(store('meta','readwrite').put(meta)); await idb(store('blobs','readwrite').put({ id: meta.id, blob })); }
  async function getAllMeta() { return await idb(store('meta','readonly').getAll()); }
  async function getBlob(id) { const r = await idb(store('blobs','readonly').get(id)); return r ? r.blob : null; }
  async function deleteVideo(id) { await idb(store('meta','readwrite').delete(id)); await idb(store('blobs','readwrite').delete(id)); }

  // 썸네일 + 길이 추출
  function makeThumb(file) {
    return new Promise((resolve) => {
      const v = document.createElement('video');
      v.preload = 'metadata'; v.muted = true; v.playsInline = true;
      const url = URL.createObjectURL(file); v.src = url;
      let done = false;
      const finish = (thumb, dur) => { if (done) return; done = true; URL.revokeObjectURL(url); resolve({ thumb, duration: dur || 0 }); };
      v.onloadeddata = () => { try { v.currentTime = Math.min(1, (v.duration || 2) / 2); } catch (e) { finish(null, v.duration); } };
      v.onseeked = () => {
        try {
          const w = 112, h = 68, c = document.createElement('canvas'); c.width = w; c.height = h;
          const ctx = c.getContext('2d'); ctx.fillStyle = '#000'; ctx.fillRect(0, 0, w, h);
          const ar = (v.videoWidth || 16) / (v.videoHeight || 9); let dw = w, dh = h;
          if (ar > w / h) dh = w / ar; else dw = h * ar;
          ctx.drawImage(v, (w - dw) / 2, (h - dh) / 2, dw, dh);
          finish(c.toDataURL('image/jpeg', 0.6), v.duration);
        } catch (e) { finish(null, v.duration); }
      };
      v.onerror = () => finish(null, 0);
      setTimeout(() => finish(null, v.duration || 0), 5000);
    });
  }

  async function updateStorage() {
    if (!navigator.storage || !navigator.storage.estimate) { storageInfo.textContent = ''; return; }
    try { const { usage } = await navigator.storage.estimate(); storageInfo.textContent = '사용 ' + (usage / 1048576).toFixed(0) + 'MB'; } catch (e) {}
  }
  function highlightPlaying() { [...savedList.children].forEach(el => el.classList.toggle('playing', el.dataset.id === String(currentSavedId))); }

  async function renderSavedList() {
    if (!db) return;
    const metas = (await getAllMeta()).sort((a, b) => b.addedAt - a.addedAt);
    savedHead.style.display = metas.length ? 'flex' : 'none';
    savedList.innerHTML = '';
    if (!metas.length) { savedList.innerHTML = '<div class="saved-empty">등록된 영상이 없어요.<br>위 버튼으로 추가하세요.</div>'; updateStorage(); return; }
    for (const m of metas) {
      const item = document.createElement('div');
      item.className = 'saved-item' + (m.id === currentSavedId ? ' playing' : '');
      item.dataset.id = m.id;
      item.innerHTML = (m.thumb ? '<img class="saved-thumb" src="' + m.thumb + '">' : '<div class="saved-thumb"></div>')
        + '<div class="saved-info"><div class="saved-name"></div><div class="saved-dur">' + fmt(m.duration) + '</div></div>'
        + '<button class="saved-del" title="삭제">×</button>';
      item.querySelector('.saved-name').textContent = m.name;
      item.addEventListener('click', (e) => { if (e.target.closest('.saved-del')) return; playSaved(m.id); });
      item.querySelector('.saved-del').addEventListener('click', async (e) => {
        e.stopPropagation();
        await deleteVideo(m.id);
        if (currentSavedId === m.id) currentSavedId = null;
        renderSavedList();
      });
      savedList.appendChild(item);
    }
    updateStorage();
  }

  async function playSaved(id) {
    const blob = await getBlob(id); if (!blob) return;
    if (localObjURL) URL.revokeObjectURL(localObjURL);
    localObjURL = URL.createObjectURL(blob);
    localVideo.src = localObjURL;
    localPlaceholder.style.display = 'none';
    localVideo.style.display = 'block';
    localVideo.playbackRate = localRate;
    localVideo.play().catch(() => {});
    currentSavedId = id; highlightPlaying();
    requestWakeLock();
  }

  pickBtn.addEventListener('click', () => fileInput.click());
  fileInput.addEventListener('change', async () => {
    const f = fileInput.files[0]; if (!f) return;
    fileInput.value = '';
    if (!db) { try { db = await openDB(); } catch (e) { alert('저장소를 열 수 없어요.'); return; } }
    pickBtn.disabled = true; const orig = pickBtn.textContent; pickBtn.textContent = '저장 중…';
    try {
      const { thumb, duration } = await makeThumb(f);
      const id = Date.now();
      await addVideo({ id, name: f.name, duration, size: f.size, thumb, addedAt: id }, f);
      await renderSavedList();
      playSaved(id);
    } catch (err) {
      alert('저장 실패: 저장 공간이 부족하거나 지원하지 않는 형식일 수 있어요.');
    } finally {
      pickBtn.disabled = false; pickBtn.textContent = orig;
    }
  });

  localVideo.addEventListener('loadedmetadata', () => { localVideo.playbackRate = localRate; });
  localVideo.addEventListener('play', () => requestWakeLock());

  // 저장소 초기화
  (async function initLibrary() {
    try {
      db = await openDB();
      if (navigator.storage && navigator.storage.persist) { try { await navigator.storage.persist(); } catch (e) {} }
      await renderSavedList();
    } catch (e) { /* IndexedDB 사용 불가 시 무시 */ }
  })();

  // ── 구간 이동 (공통) ──
  document.querySelectorAll('.seek-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      const d = duration(); if (!d) return;
      const delta = parseFloat(btn.dataset.sec);
      const t = Math.max(0, Math.min(d, curTime() + delta));
      seekTo(t);
      showToast((delta>0?'+':'') + delta + '초', delta>0?'fwd':'back');
    });
  });

  // ── 진행 상태 (공통) ──
  setInterval(() => { const d = duration(), c = curTime(); if (d) { timeRow.textContent = fmt(c) + ' / ' + fmt(d); progressFill.style.width = Math.min(100, (c/d)*100) + '%'; } }, 300);

  renderSpeed();
</script>
</body>
</html>
